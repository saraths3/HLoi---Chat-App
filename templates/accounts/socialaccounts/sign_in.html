{% load socialaccount %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HLoi — Sign In</title>
    
    <!-- Typography & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <link rel="stylesheet" href="{% static 'css/accounts/sign_in.css' %}">
</head>
<body>
    <main class="auth-surface" role="main">
        <header class="auth-header">
            <div class="app-icon-container">
                <span class="material-symbols-outlined">forum</span>
            </div>
            <h1 class="md-title">HLoi</h1>
            <p class="md-body">Sign in to sync messages, active channels, and media.</p>
        </header>

        <section class="auth-actions" aria-label="Sign In Options">
            <span class="section-label">Identity Provider</span>

            <a href="{% provider_login_url 'google' %}" class="md-btn provider-google">
                <span class="material-symbols-outlined btn-icon">account_circle</span>
                <span class="btn-text">Google</span>
            </a>

            <a href="{% provider_login_url 'github' %}" class="md-btn provider-github">
                <span class="material-symbols-outlined btn-icon">code</span>
                <span class="btn-text">GitHub</span>
            </a>

        </section>

        <footer class="auth-footer">
            <span class="material-symbols-outlined footer-icon">lock</span>
            <span class="footer-text">End-to-end local session key storage</span>
        </footer>
    </main>
</body>
</html>
